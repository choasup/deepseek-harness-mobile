# dsh-mobile 的 `mobile-app` bundle 补丁。
#
# 应用顺序（见 ~/.dsh/profiles/mobile/package.json 里的
# `dsh.profile.bundles`）：`@deepseek-ai/dsh-base` → `@deepseek-ai/dsh-headless`
# → 本文件。补丁按 id 覆盖前面层已经插入的行（dsh-app-boot 的 Profiles 文档：
# "an id-targeted patch replaces the named entry's whole `config`"），所以下面
# 每一条 `- id: X\n  disabled: true` 都是在覆盖 dsh-base 已经插入的同 id 行，
# 不是新增；真正的新增都在下面的 `insert:` 块里。
#
# iOS 第三方 app 不能 fork/exec：容器沙箱本身拒绝 process-exec 系统调用，
# AMFI 代码签名策略只允许签名链落在本 app 自己 team 内的可执行文件——这两条
# 加在一起意味着"在沙箱里跑一个通用本地 shell"（Termux 那种模式）在 iOS 上
# 根本不存在。dsh 想在 iOS 上跑起来，就必须先把每一个会 fork/exec 本地进程
# 的插件行找出来、明确关掉，再用不 fork/exec 的等价物补上同一个服务位——这里
# 是 `shell-ssh`，把执行转发到用户自己配置的远程机器。
#
# 下面每一条禁用都写清楚"这一行在 iOS 上物理不可能工作，原因是什么"，而不是
# 一句"先关着"——这样以后有人想放开某一行时，能一眼看出它到底属于"能在 iOS
# 上跑、只是这轮没接"，还是"这个能力本身在 iOS 上不存在"。

# ── A. 禁用：直接依赖本地进程的执行后端 ───────────────────────────────

# node-pty（PTY）与 child_process（管道式 exec）——iOS 应用容器的
# process-exec 策略直接拒绝 fork/exec 系统调用，AMFI 只允许执行签名链落在
# 本 app team 内的二进制，两者都用不了。这是本文件所有"本地进程"类禁用的
# 根：下面 `bash-sandbox` 之所以也要关，是因为它在这个服务之上只加了一层
# 文件沙箱包装，真正 spawn 子进程走的还是这一行。
- id: subprocess
  disabled: true

# 建在 `subprocess` 之上的一次性 bash 执行后端（confined spawn）。跟
# `subprocess` 一样卡在 iOS 没有可用本地 spawn 这件事上，无法独立于它工作。
# 由 `shell-ssh` 提供的远程 `ShellExecutor` 顶替同一个 `ctx.shell` 服务位
# （见下面 C 段）。
- id: bash-sandbox
  disabled: true

# Windows 专用的 pwsh 执行后端（走 Windows ACL，不是 landlock/Seatbelt）。
# iOS 既不是 Windows，也没有对应的远程 PowerShell 替代——这不是"暂时关掉"，
# 是这个 profile 的适用范围之外，永远不会有理由在这里重新打开。
- id: pwsh-sandbox
  disabled: true

# 本地 PTY 常驻终端（node-pty）。跟 `subprocess` 一样卡在 iOS 的 fork/exec
# 限制上。PTY 版远程实现（`dsh-terminal-ssh`：通过 SSH channel 请求一个真
# pty，而不是本仓库 `shell-ssh` 用的 plain exec channel）在架构上可行，但
# 明确不在这轮范围内——见仓库根 plan 文档"本计划不包含"一节。
#
# 补充事实：在 dsh-base + dsh-headless 这个组合下，`terminal-bash` 这一行
# 从未被真正装载过——它只出现在 `dsh-agent-presets` 挂载的 agent preset
# （`config/agent-presets/*/agent.cordis.yml`，例如 `minimal` 预设的
# `persistent-shell` 分组）里，而 headless 模式完全不挂 agent-presets（那是
# `dsh-web-app` 专属的机制，`dsh-headless` 的补丁里没有这一行）。
#
# **订正**：这里原本写着"显式禁用是防御性的，将来换成 dsh-web-app 组合时
# 不会漏"——那是错的，已被实测证伪。补丁作用于 **profile 的插件树**，
# preset 是**另一份组合**，这条禁用够不到它。真换成 dsh-web-app 之后，
# preset 照样挂 `terminal-bash`，失败信息是：
#     agent-presets: preset "minimal" failed to mount: 1 row(s) did not
#     activate: terminal-bash (...): waiting for subprocess
# 后果不是"少一个工具"，是 `session.create` 直接失败——界面上表现为
# **点了工作区选不中，没有任何报错**。真正的处理见下面 F 段。
- id: terminal-bash
  disabled: true

# ── A'. 禁用：暴露给模型的本地 shell 工具 ─────────────────────────────
# 必须和上面的执行后端一起关，否则模型的工具目录里会出现一个每次调用都失败
# 的工具。

# `tool-bash` 只声明对 `ctx.shell` 服务名的硬依赖（inject），不关心是谁
# 提供的——`shell-ssh`（见下面 C 段）现在挂载后不再在缺机器时 throw，理论上
# 只要 `ctx.shell` 迟早出现，`tool-bash` 自己就能顺着 inject 激活、跑在远程
# 执行之上，不需要这里手动协调。
#
# 但全新 profile 上 `remote-registry` 必然是空的，`ctx.shell` 因此
# **完全不会出现**——这时候把 `tool-bash` 留着 enabled 不是"安静地晾在那不
# 激活"：已经用 `@deepseek-ai/dsh-app-boot` 的真实 `boot()` 复现过，
# `assertEntriesActivated()` 把**任何**已启用条目的 PENDING 状态也算作整棵
# 树装载失败（跟 `dsh-tool-bash` 结构相同的一个最小复现：一个只声明
# `inject: ['neverProvided']`、永远等不到那个服务的插件，`boot()` 照样
# throw "1 entry did not activate: ...: pending (waiting for service:
# neverProvided)"）。也就是说，把 `tool-bash` 留着 enabled 会把"崩溃"从
# shell-ssh 挪到 tool-bash 身上，而不是真的消除它——这正是这一版改动想避免
# 的问题，只是换了个位置复现。
#
# 所以这一行继续保持 disabled，直到有别的机制能在"没有机器"时也让
# `ctx.shell` 满足 tool-bash 的 inject（同时不违反"永远不要挂一个必错的
# ctx.shell"这条约束——两者现在互斥，还没有第三种做法）。用户配置好机器后，
# 在自己的 profile 级 `cordis.patch.yml` 里把这一行改成 enabled 即可——不需要
# 同时改 `shell-ssh`，那一行现在默认就是 enabled（见 C 段）。
- id: tool-bash
  disabled: true

# 同上一条的理由：Windows 分支的模型侧工具，跟 pwsh-sandbox 一起关。
- id: tool-pwsh
  disabled: true

# ── A''. 禁用：读取本地进程/环境的探测类插件 ──────────────────────────

# 读当前机器上的 tmux 会话列表——iOS app 容器里不存在 tmux 这种东西，甚至
# 不存在"同一台机器上还有其他进程"这个概念。跟 `terminal-bash` 一样，
# dsh-base + dsh-headless 这个组合本来就没有装载它（同样只出现在 agent
# preset 里），这里的禁用同样是防御性的，理由同上。
- id: tmux-context
  disabled: true

# ── 依赖本地进程的 dsh-base 自带条目 ────────────────────
#
# 这两条不是"起进程的工具"，而是**依赖起进程能力的服务**，最初的存活扫描
# 漏掉了它们（当时 grep 的是 node:child_process，而它们用的是 dsh 的服务注入）。
# 后果比工具本身严重：assertEntriesActivated() 把 PENDING 当 FAILED，
# 所以只要它们等不到服务，**整棵插件树都起不来**。

# glob 与 grep 靠打包的 ripgrep 二进制，通过 ctx.subprocess spawn。
# 其 README 明写 "Registration is unconditional ... no load-time availability
# probe"，所以它不会自己降级——必须在这里禁掉。
# 替代实现见下方 tool-fs-search-js：纯 JS 引擎，工具定义与本实现逐字段对齐
# （由 @dsh-mobile/tool-fs-search 的 parity 测试守住）。
- id: tool-fs-search
  disabled: true

# ctx.permissionPresets 是**设置界面里的一个下拉框**（把 sandbox-mode 与
# approval-policy 两个旋钮打包成一个 Permissions 选择项），不是执行机制——
# 真正的强制在 sandbox-policy / fs-sandbox / user-approval，那三个都保留。
# 它 inject 了 shell，而 mobile profile 在未配置机器时没有 ctx.shell。
# 已核实：整个 dsh 里只有它自己和 dsh-tool-cordis（开发用内省工具，不在
# 基础组合里）引用 permissionPresets，所以禁掉它在本组合中无消费者受影响。
# 注意行 id 是 `permission`，不是包名 `permission-presets`——
# 补丁按 id 定位，写错了只会打一条 warning 然后静默无效。
- id: permission
  disabled: true

# `dsh-sandbox-local`：本地 exec 沙箱后端，两种二选一实现要么是 Linux 的
# landlock，要么是 macOS 的 sandbox-exec（Seatbelt）。iOS 上两者都不存在——
# 不是这个内核，也没有 sandbox-exec 这个系统程序。但这不代表 iOS 上"没有
# 沙箱"：iOS 应用容器本身就是操作系统级别的沙箱边界（App Sandbox /
# container），dsh 完全不需要、也没有能力在它之上再实现一层本地 exec
# 沙箱。`fs-sandbox`（`dsh-fs-sandbox`）与 `sandbox-policy`
# （`dsh-sandbox-policy`）**不在**这份禁用清单里——它们只是策略/工作区根
# 值的持有者，约束的是 `tool-fs` 这类纯 JS 文件系统工具的读写范围，不依赖
# 任何本地 exec 能力，在 iOS 上依然有意义、依然生效。
- id: sandbox
  disabled: true

# ── B. 新增：mobile 专属的四个插件行 ──────────────────────────────────
#
# `name` 用**裸包名**，跟 dsh 自己的补丁写法一致。
#
# 裸包名能不能解析，**取决于跑 dsh 的 Node 版本**（2026-09-07 实测，
# 同一个 dsh 安装、同一份 profile）：
#
#   Node 24.19  裸包名解析成功
#   Node 20.20  失败：Cannot find package '@dsh-mobile/…' imported from
#               .../cordis-plugin-loader/lib/index.js
#
# 这解释了此处注释的两次反复：最初记的"必须用 ./node_modules 相对路径"是在
# Node 20 下观察到的（这台机器 Homebrew 的 dsh shebang 走 PATH 上的 node，
# 默认就是 20），后来"证伪"是在 Node 24 下测的。两次观察都是真的，
# 变量是 Node 版本，不是谁判断错了。
#
# 用裸包名是安全的：dsh 自己的 engines 是 `^22.19 || >=24`，Node 20 本来就
# 不是支持的运行环境（在 20 上还会先撞 zstd / Promise.withResolvers /
# stripTypeScriptTypes 三个硬失败）。
#
# 另一条约束与写法无关，但同样必需：**五个包都要列为 profile 的直接依赖**，
# 因为 pnpm 只把直接依赖提到 node_modules 顶层。
#
# 另外注意 profile 的 `bundles` 走的是另一条解析路径
# （`dsh-app-boot` 的 `resolveBundleDir`），报错长得不一样
# （`cannot resolve profile bundle "..."`），别把两者混为一谈。
- insert:
    # 注意：**storage 三层不在这里**。
    #
    # 它们曾经在这个 patch 里，因为 dsh-base + dsh-headless 不提供 storage，
    # 而 remote-registry 注入 storageDomain。当时的注释写着"行 id 与
    # dsh-web-app 保持一致，两个 bundle 叠加时按 id 覆盖" ——**那是错的**：
    # insert 列表是拼接的，重复 id 会直接抛 `duplicate loader entry id: storage`，
    # 把这个 bundle 和 dsh-web-app 叠在一起就起不来。
    #
    # 正确的归属是 **profile 级**：`dsh-web-app` 自带 storage，`dsh-headless`
    # 不带。"我这个组合缺什么"是 profile 自己的事，不是 bundle 该替它决定的。
    # 所以基于 headless 的 profile 要在自己的 cordis.patch.yml 里补这三行
    # （仓库 README 的安装步骤有现成的），基于 web-app 的则不需要。

    - id: remote-registry
      name: '@dsh-mobile/remote-registry/plugin'

    # 未配置机器时会发生什么（改过一版，见下方"这版为什么变了"）
    # ────────────────────────────────────────────────────────────────
    # `shell-ssh` 的 `apply()` 现在的行为：`config.machine` 在 `ctx.remotes`
    # 里查不到时，记一条 `ctx.logger.warn`（点名机器名 + 下一步该做什么），
    # 正常返回——不 throw，也不注册 `ctx.shell`。这一行本身因此总能挂载
    # 成功（`disabled: true` 不再需要），全新安装的 `dsh --profile mobile`
    # 完全正常启动：文件工具、skill、web 搜索、subagent 等等都可用，唯独
    # `ctx.shell` 这个服务在机器配置好之前不存在。
    #
    # 这版为什么变了：原来的设计是"查不到机器就 throw SSH_NO_MACHINE，让
    # 整个插件条目加载失败"，理由是"没有退化模式，快速失败好过悄悄挂着一个
    # 永远报错的 ctx.shell"。但这个插件在这里只是 mobile-app bundle 里的一个
    # 普通 Loader 条目，`@deepseek-ai/dsh-app-boot` 的 `assertEntriesActivated()`
    # 会把**任何一个**已启用条目的加载失败算作**整棵插件树**装载失败——
    # 已经用真实的 `boot()` 复现过：全新 profile 上 `RemoteRegistry` 必然
    # 是空的，所以 `dsh --profile mobile` 会在**任何**调用（包括
    # `--help`、包括跟 shell 完全无关的任务）上直接崩溃退出，直到用户配置
    # 好一台机器。这已经不是"快速失败"，是"这个 app 在配置完成前完全没法
    # 用"，把"没有退化模式"的范围从"这一个插件条目"错误地扩大成了"整个
    # 进程"。新设计把这条约束收回到它该待的范围：没有机器时，`ctx.shell`
    # 确实"没有退化模式"（不存在，不会有一个必错的实现在假装能用），但这
    # 件事只影响需要 `ctx.shell` 的消费者，不影响其他任何东西。
    #
    # `tool-bash` 现在会怎样：见上面 A' 段——`ctx.shell` 缺失时，
    # `tool-bash` 硬 inject 的服务没有着落，它自己的 fiber 会停在 PENDING，
    # 而 PENDING 本身也会被 `assertEntriesActivated()` 当成启动失败（同一
    # 招复现验证过）。所以 `tool-bash` 这一行**仍然需要**保持 disabled，
    # 直到有机制能在没有机器时也满足它的 inject——这不是 shell-ssh 这一层
    # 能单独解决的事，取决于 mobile-app 这份补丁自己的选择。
    #
    # 已知的功能缺口：注册一台新机器目前**不会**让已经跑起来的
    # `ctx.shell` 活过来——`apply()` 只在挂载那一刻查一次
    # `ctx.remotes.get()`，没有订阅 `remote-registry` 底层
    # `dsh-storage-domain` 已经在发的 `domain/changed` 事件（`domain:
    # 'remote_registry', table: 'machines', key: <机器名>`），所以中途注册
    # 机器需要重启 dsh（或者一次配置热重载）才能让这一行重新解析、真正
    # 挂上 `ctx.shell`。现在还没有配机器的界面，这个"重启才生效"的缺口可以
    # 接受；把它做成真正响应式（订阅这个已有事件，机器一出现就补挂
    # `ctx.shell`）预计是 `shell-ssh` 包内部一处不大的改动——不需要改
    # `remote-registry`（`domain/changed` 已经带够信息可以过滤），但需要
    # 一次独立的实现 + 测试，这里不顺手做。
    - id: shell-ssh
      name: '@dsh-mobile/shell-ssh/plugin'
      config:
        # 全新安装时几乎肯定查不到这个名字——这是预期状态，不是配置错误：
        # 见上面大段注释，查不到时这一行只是安静地不提供 ctx.shell。用户
        # 注册好机器后，在自己的 profile 级 cordis.patch.yml 里把这里的值
        # 换成那台机器的真实 name（再重启 dsh，见上面的"已知的功能缺口"）。
        machine: default

    # 纯 JS 的 glob / grep，顶替上面禁掉的 tool-fs-search。
    # 它注入 fs 而不是 subprocess——iOS 上起不了进程，但读文件可以。
    # 工具名、参数 schema、输出 schema、系统提示词的 order 全部与 dsh 的实现
    # 对齐（有 parity 测试守住），所以对模型而言这次替换是透明的。
    # 移动版外框，顶替上面禁掉的 ui-layout。
    # 注意它同时**接管了主题投影**：把设计令牌写进 document.body 这件事，
    # dsh 是顺手放在 layout 包里做的（那个包的 README：the package also
    # seats the theme presenter）。换掉 layout 而不接这一步，后果不是"主题
    # 不对"，是所有 --dsw-* 变量没人写，整个界面全部掉成无样式。
    - id: ui-layout-mobile
      name: '@dsh-mobile/client-ui-layout-mobile'

    - id: tool-fs-search-js
      name: '@dsh-mobile/tool-fs-search/plugin'


# ── D. MCP：不新增行，只留一条约束说明 ────────────────────────────────
#
# `@deepseek-ai/dsh-mcp-client` 不是"一个全局服务 + 一个传输方式配置项"的
# 形状：它是"每挂一个实例对应一个 MCP server"的插件，`transport` 是它自己
# `Config` 上的一个判别式联合字段（`'stdio' | 'streamable-http'`），在
# **添加某个具体 server 的那一行**上选择，不存在一个全局开关能替所有实例
# 决定走哪条传输（见该包 `lib/types/index.d.ts` 里 `StdioConfig` /
# `StreamableHttpConfig` 两个互斥接口，以及 README 里两条示例分别在各自的
# 行上写 `transport: stdio` / `transport: streamable-http`）。
#
# 更重要的是：`dsh-base`、`dsh-headless`、`dsh-web-app` 三个官方 bundle
# 都**没有**挂载任何一个 `dsh-mcp-client` 实例（已核对三份 `cordis.patch.yml`
# 源文件），所以在这个 profile 组合里根本没有一个已存在的 `id: mcp-*` 行可
# 供本补丁覆盖——patch 是按 id 覆盖既有行，不能对一个尚不存在的 id 预先
# 写下"以后必须是什么样"的约束，硬造一个从未被引用过的配置键只会是一个
# 没人读的死配置。
#
# 所以这里不新增行，只把约束写清楚给以后任何往这个 profile 加 MCP server
# 的人看：任何新增的 `dsh-mcp-client` 行，`transport` 必须是
# `streamable-http`，绝不能是 `stdio`——`stdio` 传输的实现是
# `child_process.spawn` 一个子进程（`StdioClientTransport`），这正是本文件
# 开头说的、iOS 沙箱直接拒绝的 process-exec 路径，跟 `subprocess`/
# `bash-sandbox` 被禁用是同一个物理限制，不是这个 profile 单独的偏好。

# ── E. subagent 的 codex / claude-code provider ───────────────────────
#
# dsh-base 在这个 profile 组合下并不挂载 `tool-subagent-codex` /
# `tool-subagent-claude-code`（那两行只存在于 `standard`/`code` 等 agent
# preset 里，headless 模式不挂 preset，见 A 段 `terminal-bash` 的说明）。
# 即便挂载，它们默认也是 `disabled: true`（preset 文件原话："Production
# dsh does not install these optional providers"）——`codex`/`claude-code`
# provider 本身就是各自 fork 一个外部 CLI 子进程，同样撞在 iOS 的
# process-exec 限制上，不需要本文件额外处理。

# ── F. 禁用：agent preset 机制（只在叠加 dsh-web-app 时存在这一行）─────
#
# `dsh-agent-presets` 由 `dsh-web-app` 插入，dsh-headless 没有这一行——
# 对基于 headless 的 profile 这条禁用只会打一条 warning，无害。
#
# 三个自带 preset（minimal / standard / code）**每一个**都挂
# `persistent-shell` 分组：`dsh-terminal`（PTY 注册表）+
# `dsh-terminal-bash`（注入 `subprocess`）+ `dsh-tool-bash-persistent`。
# iOS 上 `subprocess` 不存在（见本文件开头），所以这三个 preset 在这个
# profile 里**没有一个能挂载成功**。
#
# 为什么必须在这里关掉，而不是靠上面 A 段那条 `- id: terminal-bash`：
# 补丁作用于 profile 的插件树，preset 是独立的一份组合，patch 够不到它的
# 行（见 A 段的订正）。preset 挂载失败会让 `session.create` 整个失败，
# 而前端对这个失败**没有可见提示**——界面表现是"点了工作区，菜单收起来，
# 什么都没发生"，极难从现象反推到原因。
#
# 关掉之后 web 界面用默认组合（也就是这份 profile 的插件树本身），
# 上面所有禁用/替换都照常生效。代价是设置里的 preset 选择器没有可选项——
# 在 iOS 上它本来也不该有：能选的三个都是坏的。
#
# 要恢复它，需要的是一个不含 shell 行的移动端 preset，而不是打开这一行。
- id: agent-presets
  disabled: true

# ── G. 换掉桌面版 layout（只在叠加 dsh-web-app 时存在这一行）───────────
#
# `dsh-client-ui-layout` 是三栏 AppFrame：侧栏 | 会话 | 详情，栏间有 8px 拖拽
# 把手，侧栏收起后仍常驻一条 56px 控制条。在手机上这套的问题不是"挤"，
# 是每一条都用不上：竖栏白占宽度、8px 把手手指点不中（iOS HIG 最小触控目标
# 是 44pt）、三栏让路链在单列宽度下没有意义。
#
# 换成 `@dsh-mobile/client-ui-layout-mobile`：单栏 + 顶栏菜单键，侧栏改左侧
# 抽屉、详情改底部 sheet，两者都用 transform 移出屏幕而不卸载（占位插件的
# 内部状态因此保留，与桌面版"width 0 但子树仍挂载"同一约定）。
#
# 其余 32 个客户端 UI 插件**一个都不用动**：它们注册的目标是 slot 名
# （sidebar / conversation / details / shell.overlay），不是某个具体的 layout
# 包。新的外框把这四个名字一字不差地声明出来，注册就照常落位。
#
# 这一步能成立的前提是：客户端 UI 插件是**运行时**从
# `/plugins/<包名>/client.js` 拉的，不是编译进 dsh-web-frontend 的 dist。
# `dsh-client-modules` 的 README 原话：Node 半边"扫描已启用的 Loader 条目，
# 找出带 dsh.client 的 web 包，解析各自的 exports['./client']"再挂到
# /plugins 下。所以换 layout 不需要重建 dsh 的前端。
- id: ui-layout
  disabled: true
