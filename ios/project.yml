name: DshMobile
options:
  bundleIdPrefix: com.dshmobile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DshMobile:
    type: application
    platform: iOS
    sources:
      - path: DshMobile
    # xcodegen 会重新生成这个 plist，所以键必须写在这里而不是文件里
    # ——直接编辑生成出来的 Info.plist 会在下次 generate 时被静默丢弃。
    info:
      path: DshMobile/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # host 跑在 loopback 上，是明文 HTTP。只对本地网络放行，
        # 不开全局 NSAllowsArbitraryLoads——设备内 runtime 落地后同样是 localhost。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshmobile.shell
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # 模拟器上跑，不签名。上架不在这一轮的目标里。
        CODE_SIGNING_ALLOWED: NO
