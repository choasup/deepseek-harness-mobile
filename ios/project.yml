name: DshMobile
options:
  bundleIdPrefix: com.dshmobile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DshMobile:
    type: application
    platform: iOS
    sources:
      - path: DshMobile
      - path: NodeRuntime
    # xcodegen 会重新生成这个 plist，所以键必须写在这里而不是文件里
    # ——直接编辑生成出来的 Info.plist 会在下次 generate 时被静默丢弃。
    info:
      path: DshMobile/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # host 是明文 HTTP。模拟器上是 loopback，真机上是用户填的局域网地址
        # （192.168.x.x 这类）——**NSAllowsLocalNetworking 覆盖不到它**，
        # 那个键只放行无限定主机名、.local 和链路本地地址（169.254/16、fe80::/10）。
        # 所以真机要连 Mac 就只能开 NSAllowsArbitraryLoads。
        #
        # 权衡说清楚：这个 app 只加载**用户自己填的那一个** URL，不加载别的任何
        # 远端资源，所以放开的面就是那一个地址。设备内 runtime 落地后地址回到
        # app 自己的 loopback，这一条就该删掉。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # iOS 14 起访问局域网要用户授权，没有这条描述系统不会弹授权框，
        # 连接会直接失败——而失败信息看不出是权限问题。
        NSLocalNetworkUsageDescription: 用于连接你 Mac 上运行的 dsh host。
        # dshmobile://settings[?url=…] —— 连接设置的第二个入口。
        # 摇一摇是给人的，这个是给自动化和"界面卡住时从链接回来"用的。
        CFBundleURLTypes:
          - CFBundleURLName: com.dshmobile.shell
            CFBundleURLSchemes: [dshmobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshmobile.shell
        # Swift 通过它看到 dsh_node_start。
        SWIFT_OBJC_BRIDGING_HEADER: NodeRuntime/DshMobile-Bridging-Header.h
        # Node/V8 的 30 个静态库（gtest 与 torque 是构建期用的，没拷进来）。
        # 它们不入库，由 vendor/build-node22-ios.sh 产出后拷到 NodeLibs/。
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/NodeLibs
        OTHER_LDFLAGS:
          - $(inherited)
          # V8 与 Node 之间有环形符号依赖，静态库单遍扫描解决不了；
          # 让链接器反复搜索，比手工排序稳。
          - -Wl,-search_paths_first
          - -labseil
          - -lada
          - -lbrotli
          - -lcares
          - -lcrdtp
          - -lhistogram
          - -lllhttp
          - -lnbytes
          - -lncrypto
          - -lnghttp2
          - -lnode
          - -lopenssl
          - -lsimdjson
          - -lsimdutf
          - -lsqlite
          - -luv
          - -luvwasi
          - -lv8_base_without_compiler
          - -lv8_compiler
          - -lv8_init
          - -lv8_initializers
          - -lv8_initializers_slow
          - -lv8_libbase
          - -lv8_libplatform
          - -lv8_snapshot
          - -lv8_turboshaft
          - -lv8_zlib
          - -lzlib
          - -lzlib_data_chunk_simd
          - -lzstd
          - -lc++
          # CoreFoundation：abseil 的时区查询要用（就是 embedtest 链不上的那个）。
          # 其余是 Node 在 Apple 平台的常规依赖。
          - -framework
          - CoreFoundation
          - -framework
          - Security
          - -framework
          - SystemConfiguration
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # 真机要签名。这里是 Xcode 里登录的那个账号的 team，**不是**钥匙串里
        # 证书的 team——这台机器上两者不同：钥匙串有一张机构证书
        # (3L724S787J)，但 Xcode 登录的是免费个人 team (4752F9442A)。
        # 填错的报错是 `No Account for Team "…"`，看着像"没登录"，
        # 实际是"登录的账号没有这个 team"。
        # 查法：plutil -p ~/Library/Preferences/com.apple.dt.Xcode.plist | grep teamID
        #
        # 免费个人 team 的限制：签出来的 app **7 天后过期**，到期要重装。
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4752F9442A
