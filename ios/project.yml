name: DshMobile
options:
  bundleIdPrefix: com.dshmobile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DshMobile:
    type: application
    platform: iOS
    sources:
      - path: DshMobile
      - path: NodeRuntime
      # libwebp（1.5.0，BSD）。只为编码而带：iOS 的 ImageIO 能读 WebP 但写不了，
      # 而 dsh 的附件归一化对带透明通道的图只提供 WebP 这一条路径。
      # 见 WebP/dsh_webp.h。
      - path: WebP
      # 设备上要跑的那套 Node 代码（dsh 及其依赖，约 231MB）。
      # type: folder 是关键——按文件夹整体引用，保持目录结构；
      # 默认的 group 方式会把每个文件平铺进 Resources，node_modules 的
      # 相对路径全部失效。不入库，由 prepare-nodejs-project.sh 产出。
      - path: nodejs-project
        type: folder
        buildPhase: resources
    # xcodegen 会重新生成这个 plist，所以键必须写在这里而不是文件里
    # ——直接编辑生成出来的 Info.plist 会在下次 generate 时被静默丢弃。
    info:
      path: DshMobile/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # host 是明文 HTTP。
        #
        # 当初真机要连 Mac 上的 host（192.168.x.x），而
        # **NSAllowsLocalNetworking 覆盖不到那类地址**——那个键只放行无限定
        # 主机名、.local 和链路本地地址（169.254/16、fe80::/10），所以只能开
        # NSAllowsArbitraryLoads。
        #
        # **这个前提已经不成立了**：runtime 现在跑在设备内，正常路径连的是
        # app 自己的 127.0.0.1:47799。还留着它的唯一原因是 HarnessEndpoint
        # 里那个开发用的地址覆盖（可以指向局域网）。
        #
        # 该删，但**要在真机上验过再删**：ATS 对 loopback 的豁免在各 iOS 版本
        # 上的说法并不一致，删错了症状是 app 整个白屏、且看不出是 ATS 拦的。
        # 顺序应该是：先去掉 → 装真机 → 确认 WebView 能加载 → 再一并去掉
        # HarnessEndpoint 的局域网覆盖。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # iOS 14 起访问局域网要用户授权，没有这条描述系统不会弹授权框，
        # 连接会直接失败——而失败信息看不出是权限问题。
        NSLocalNetworkUsageDescription: 用于连接本机运行的 dsh host。
        # agent 请求拍照时用。系统会在第一次请求时弹授权框——按不按快门是人的事。
        NSCameraUsageDescription: 让 agent 在你同意后拍一张照片作为输入。
        # 传感器。加速度计/陀螺仪/磁力计**不需要**这条，但气压计、计步和运动
        # 状态识别需要（CMAltimeter / CMPedometer / CMMotionActivityManager）；
        # 缺了它们不是"读到 0"，是直接崩。
        NSMotionUsageDescription: 让 agent 读取气压、步数与运动状态。
        # 定位不在默认读取的集合里，要模型显式点名才会走到这里。
        NSLocationWhenInUseUsageDescription: 让 agent 在你同意后读取当前位置与朝向。
        # dshmobile://settings[?url=…] —— 连接设置的第二个入口。
        # 摇一摇是给人的，这个是给自动化和"界面卡住时从链接回来"用的。
        CFBundleURLTypes:
          - CFBundleURLName: com.dshmobile.shell
            CFBundleURLSchemes: [dshmobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshmobile.shell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Swift 通过它看到 dsh_node_start 与 dsh_webp_encode_rgba。
        SWIFT_OBJC_BRIDGING_HEADER: NodeRuntime/DshMobile-Bridging-Header.h
        # libwebp 内部按 "src/webp/…" 的形式互相包含，所以搜索根是 WebP/ 本身。
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/WebP
        # libwebp 自带的 SIMD 分派在 arm64 上只会走 NEON；其余分支靠宏关掉。
        # 这些告警是上游代码的，不是我们的，压掉以免淹没自己的告警。
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        # Node/V8 的 30 个静态库（gtest 与 torque 是构建期用的，没拷进来）。
        # 它们不入库，由 vendor/build-node22-ios.sh 产出后拷到 NodeLibs/。
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/NodeLibs
        OTHER_LDFLAGS:
          - $(inherited)
          # V8 与 Node 之间有环形符号依赖，静态库单遍扫描解决不了；
          # 让链接器反复搜索，比手工排序稳。
          - -Wl,-search_paths_first
          - -labseil
          - -lada
          - -lbrotli
          - -lcares
          - -lcrdtp
          - -lhistogram
          - -licudata
          - -licui18n
          - -licustubdata
          - -licuucx
          - -lllhttp
          - -lnbytes
          - -lncrypto
          - -lnghttp2
          - -lnode
          - -lopenssl
          - -lsimdjson
          - -lsimdutf
          - -lsqlite
          - -luv
          - -luvwasi
          - -lv8_base_without_compiler
          - -lv8_compiler
          - -lv8_init
          - -lv8_initializers
          - -lv8_initializers_slow
          - -lv8_libbase
          - -lv8_libplatform
          - -lv8_snapshot
          - -lv8_turboshaft
          - -lv8_zlib
          - -lzlib
          - -lzlib_data_chunk_simd
          - -lzstd
          - -lc++
          # CoreFoundation：abseil 的时区查询要用（就是 embedtest 链不上的那个）。
          # 其余是 Node 在 Apple 平台的常规依赖。
          - -framework
          - CoreFoundation
          - -framework
          - Security
          - -framework
          - SystemConfiguration
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # 真机要签名。这里是 Xcode 里登录的那个账号的 team，**不是**钥匙串里
        # 证书的 team——同一台机器上很可能同时存在两者（比如一张单位发的
        # 机构证书，和你自己登录的个人开发者账号），而它们的 team 不同。
        # 填错的报错是 `No Account for Team "…"`，看着像"没登录"，
        # 实际是"登录的账号没有这个 team"。
        # 查法：plutil -p ~/Library/Preferences/com.apple.dt.Xcode.plist | grep teamID
        #
        # 这个 team 已入 Apple Developer Program（isFreeProvisioningTeam: false），
        # 所以签出来的 app 没有免费账号那个 7 天过期限制，TestFlight 也可用。
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4752F9442A
